<!-- Customer Service Staff > Reports (cs-report.html): the Ticket Report only.
     Fragment: navbar.js inserts it into the app shell (NAV_PAGES), pages.js (crmRenderReports -> crmLoadReportsData -> crmFillReports) fills it.
     Same markup, ids and classes as the matching tab of manager-admin-report.html, so Admin / Manager and this role always see the same report.
     Backend: reports-api.php (it reads the signed-in role and returns ONLY this person's numbers). No new CSS. -->
<main class="content-body p-3 p-md-4 flex-grow-1 rp-page sd-dashboard" id="reportsPage"
      data-api="reports-api.php" data-report-title="Ticket Report" data-report-type="tickets">

  <div class="d-flex flex-wrap align-items-start justify-content-between gap-2 mb-3">
    <h2 class="fw-bold m-0 text-uppercase">TICKET REPORT</h2>
    <span class="rp-scope"><i class="rp-scope-dot"></i><span id="reportScopeRole">Support Tickets</span></span>
  </div>

  <!-- Date filter + export buttons (shared by all tabs) -->
  <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-3 rp-actions">
    <div class="d-flex flex-wrap align-items-end gap-2">
      <div>
        <label class="small fw-semibold d-block mb-1" id="reportDateTitle">Date</label>
        <div class="dropdown" id="reportDateDropdown">
          <button class="btn custom-dropdown-toggle rp-date-btn d-flex align-items-center justify-content-between gap-3 px-3 py-2"
            type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <div class="d-flex align-items-center gap-2"><i class="bi bi-calendar3 rp-green"></i><span id="reportDateLabel">Monthly</span></div>
            <i class="bi bi-chevron-down small"></i>
          </button>
          <ul class="dropdown-menu custom-dropdown-menu shadow-sm border-0 p-0 overflow-hidden" id="reportDateMenu">
            <li><a class="dropdown-item custom-dropdown-item py-2 px-3" href="#">Weekly</a></li>
            <li><a class="dropdown-item custom-dropdown-item py-2 px-3" href="#">Monthly</a></li>
            <li><a class="dropdown-item custom-dropdown-item py-2 px-3" href="#">Custom Date Range</a></li>
          </ul>
        </div>
      </div>
      <!-- the exact dates of the chosen range (filled from reports-api.php) -->
      <span class="rp-scope" id="reportRangeText"></span>
      <!-- Custom Date Range: Start / End date (hidden until "Custom Date Range" is picked) -->
      <div class="rp-custom-dates d-none" id="reportCustomDates">
        <div>
          <label class="small fw-semibold d-block mb-1" for="reportStartDate">Start Date</label>
          <div class="bk-date-range"><input type="date" id="reportStartDate" aria-label="Start Date"></div>
        </div>
        <div>
          <label class="small fw-semibold d-block mb-1" for="reportEndDate">End Date</label>
          <div class="bk-date-range"><input type="date" id="reportEndDate" aria-label="End Date"></div>
        </div>
      </div>
    </div>
    <div class="d-flex gap-2">
      <!-- the id stays exportCsvBtn because download-export.js listens for it -->
      <button type="button" class="btn modal-btn-cancel px-3 d-flex align-items-center gap-2" id="exportCsvBtn"><i class="bi bi-file-earmark-excel"></i> Export CSV</button>
      <button type="button" class="btn modal-btn-save px-3 d-flex align-items-center gap-2" id="downloadPdfBtn"><i class="bi bi-printer"></i> Download PDF</button>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-12 col-sm-6 col-xl-3"><div class="card sd-stat border-0 shadow-sm p-3 rounded-4 h-100"><span class="stat-label d-block mb-1">Total Tickets</span><div class="stat-number" id="totalTickets">0</div><div class="rp-delta" data-delta="ticket.total" data-good="neutral"></div></div></div>
    <div class="col-12 col-sm-6 col-xl-3"><div class="card sd-stat border-0 shadow-sm p-3 rounded-4 h-100"><span class="stat-label d-block mb-1">Open Tickets</span><div class="stat-number is-orange" id="openTicketsCount">0</div><div class="rp-delta" data-delta="ticket.open" data-good="down"></div></div></div>
    <div class="col-12 col-sm-6 col-xl-3"><div class="card sd-stat border-0 shadow-sm p-3 rounded-4 h-100"><span class="stat-label d-block mb-1">In Progress Tickets</span><div class="stat-number" id="inProgressTickets">0</div><div class="rp-delta" data-delta="ticket.in_progress" data-good="neutral"></div></div></div>
    <div class="col-12 col-sm-6 col-xl-3"><div class="card sd-stat border-0 shadow-sm p-3 rounded-4 h-100"><span class="stat-label d-block mb-1">Resolved Tickets</span><div class="stat-number is-green" id="resolvedTickets">0</div><div class="rp-delta" data-delta="ticket.resolved" data-good="up"></div></div></div>
  </div>
  <div class="row g-3 mb-3">
    <div class="col-12 col-lg-6"><div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 h-100">
      <div class="rp-card-head"><div><h5 class="fw-bold m-0">Ticket Status Distribution</h5></div></div>
      <div class="rp-chart" id="ticketsByStatusChart" data-report-chart="Ticket Status Distribution" data-chart-style="donut" data-donut-caption="TICKETS" data-items='[]'></div>
    </div></div>
    <div class="col-12 col-lg-6"><div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 h-100">
      <div class="rp-card-head"><div><h5 class="fw-bold m-0">Tickets by Priority</h5></div></div>
      <div class="rp-hchart" id="ticketsByPriorityChart" data-report-chart="Tickets by Priority" data-items='[]'></div>
    </div></div>
  </div>
<div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 rp-perf-card">
  <div class="rp-card-head"><div><h5 class="fw-bold m-0">Ticket Resolution</h5><p class="rp-sub">How much of the support workload is already solved</p></div></div>
  <div class="rp-perf-grid" id="ticketPerfGrid"></div>
</div>
</main>
