<!-- Admin + Manager > Customers.  Save as html-content-navbar/manager-admin-customers.html
     Same building blocks as the Inquiries page (.iq-page, .iq-pool-head, .iq-grid, .iq-card, .table-search-input, .custom-dropdown-*).
     The cards and the detail view are built by crmInitCustomers() in pages.js from customers-api.php. -->
<main class="iq-page p-3 p-md-4" id="customersPage" data-api="customers-api.php">

    <!-- ============ LIST VIEW ============ -->
    <section id="custListView">
        <h2 class="fw-bold text-uppercase mb-4">Customers</h2>

        <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 mb-4">
            <div class="position-relative flex-grow-1">
                <i class="bi bi-search search-icon position-absolute top-50 start-0 translate-middle-y ms-3" aria-hidden="true"></i>
                <input type="search" id="custSearch" class="form-control table-search-input ps-5"
                    placeholder="Search by Customer ID, Name, Email, or Phone Number" autocomplete="off" maxlength="100">
            </div>

            <div class="d-flex flex-wrap flex-sm-nowrap gap-3">
            <div class="dropdown staff-filter-dropdown">
                <button class="btn custom-dropdown-toggle d-flex align-items-center justify-content-between gap-3 px-3 w-100"
                    type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <span id="custRegLabel" data-default-label="All Registered Customers">All Registered Customers</span>
                    <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <ul class="dropdown-menu custom-dropdown-menu" id="custRegMenu">
                    <li><a class="dropdown-item custom-dropdown-item py-2 px-3" href="#" data-value="all" aria-selected="true">All Registered Customers</a></li>
                    <li><a class="dropdown-item custom-dropdown-item py-2 px-3" href="#" data-value="today">Today</a></li>
                    <li><a class="dropdown-item custom-dropdown-item py-2 px-3" href="#" data-value="7d">Last 7 Days</a></li>
                    <li><a class="dropdown-item custom-dropdown-item py-2 px-3" href="#" data-value="30d">Last 30 Days</a></li>
                    <li><a class="dropdown-item custom-dropdown-item py-2 px-3" href="#" data-value="month">This Month</a></li>
                    <li><a class="dropdown-item custom-dropdown-item py-2 px-3" href="#" data-value="year">This Year</a></li>
                </ul>
            </div>
            </div>
        </div>

        <div class="iq-pool-head">
            <h3 class="iq-pool-title">Customer Records</h3>
            <span class="text-muted" id="custCount">0 customers</span>
        </div>

        <div class="iq-grid" id="custGrid"></div>
        <p class="iq-state" id="custState">Loading customers...</p>

        <!-- Shown when the search / filter matches nothing (same shared "No results found" design as Inquiries) -->
        <div class="crm-no-results-state iq-no-results" id="custNoResults" role="status" hidden>
            <i class="bi bi-search" aria-hidden="true"></i>
            <p class="crm-no-results-title">No results found</p>
            <p class="crm-no-results-description">Try changing your search or filters.</p>
        </div>
    </section>

    <!-- ============ DETAIL VIEW (filled by pages.js) ============ -->
    <section id="custDetailView" hidden></section>
</main>
