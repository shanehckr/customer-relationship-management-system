<!-- Admin + Manager: Customer Service > Tickets (ONE shared page for both roles).
     Same structure and mobile layout as Inquiries (manager-admin-inquiries.html).
     No data is written here: the cards AND the View (detail) page are built automatically by
     pages.js (crmInitTicketCards / crmTicketDetailHTML) from the tickets the backend returns. -->
<div class="iq-page p-3 p-md-4" id="ticketsPage" data-api="tickets-api.php?action=list">

  <!-- LIST VIEW: title, search, filters and the ticket cards -->
  <div id="tkListView">
    <h2 class="fw-bold text-uppercase mb-4">Tickets</h2>

    <!-- Search: its own row on every screen size -->
    <div class="position-relative mb-3">
      <i class="bi bi-search search-icon position-absolute top-50 start-0 translate-middle-y ms-3" aria-hidden="true"></i>
      <input type="search" id="ticketsSearchInput" class="form-control table-search-input ps-5"
             placeholder="Search tickets by ID, customer name, or subject..." aria-label="Search tickets">
    </div>

    <!-- Filters: Ticket Status | Priority | Date (reuses the Bookings filter grid + date box).
         Desktop: 3 across. Tablet/phone: the two dropdowns on ONE row, date box below. -->
    <div class="bk-filters tk-filters">
      <div class="dropdown">
        <button type="button" class="btn custom-dropdown-toggle d-flex justify-content-between align-items-center w-100"
                data-bs-toggle="dropdown" aria-expanded="false">
          <span>Ticket Status</span>
          <i class="bi bi-chevron-down ms-2" aria-hidden="true"></i>
        </button>
        <ul class="dropdown-menu custom-dropdown-menu" id="statusFilterDropdown"></ul>
      </div>

      <div class="dropdown">
        <button type="button" class="btn custom-dropdown-toggle d-flex justify-content-between align-items-center w-100"
                data-bs-toggle="dropdown" aria-expanded="false">
          <span>Priority</span>
          <i class="bi bi-chevron-down ms-2" aria-hidden="true"></i>
        </button>
        <ul class="dropdown-menu custom-dropdown-menu" id="priorityFilterDropdown"></ul>
      </div>

      <label class="bk-date-range" for="ticketsDateFilter">
        <i class="bi bi-calendar3" aria-hidden="true"></i>
        <input type="date" id="ticketsDateFilter" aria-label="Filter by submitted date">
      </label>
    </div>

    <div class="iq-pool-head">
      <h3 class="iq-pool-title">Active Support Requests</h3>
      <span class="text-muted">Customer Service Desk</span>
    </div>

    <!-- Cards are inserted here -->
    <div class="iq-grid" id="ticketsGrid"></div>
    <p class="iq-state" id="ticketsState">Loading tickets...</p>

    <!-- Shown when the search / filters match nothing (same shared "No results found" design) -->
    <div class="crm-no-results-state iq-no-results" id="ticketsNoResults" role="status" hidden>
      <i class="bi bi-search" aria-hidden="true"></i>
      <p class="crm-no-results-title">No results found</p>
      <p class="crm-no-results-description">Try changing your search or filters.</p>
    </div>
  </div>

  <!-- DETAIL VIEW: filled by pages.js when a card's View button is pressed -->
  <div id="tkDetailView" hidden></div>

</div>
