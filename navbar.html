<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <!-- Instant Theme Sync -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const themeToApply = savedTheme || (prefersDark ? 'dark-mode' : 'light-mode');
      document.documentElement.className = themeToApply;
      document.documentElement.style.backgroundColor = (themeToApply === 'light-mode') ? '#ffffff' : '#050d0a';
    })();
  </script>

  <!-- Anti-Flicker Collapsed Sidebar Sync -->
  <script>
    (function() {
      if (localStorage.getItem('sidebarCollapsed') === 'true') {
        document.documentElement.classList.add('sidebar-is-collapsed');
      }
    })();
  </script>

  <!-- Anti-Flicker Role Sync (runs in <head>, BEFORE anything is drawn)
       1) read the role and put it on <html> as a class (role-manager, role-customer-service ...)
       2) CSS hides the sidebar items that role must not see, so nothing flashes on refresh
       Keep the role names here the same as data-role="..." in the sidebar. -->
  <script>
    (function () {
      var r = (localStorage.getItem('userRole') || 'admin').toLowerCase().replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (r === 'cs' || r === 'cs staff' || r === 'customer service staff') r = 'customer service';
      if (r === 'sales') r = 'sales staff';
      document.documentElement.classList.add('role-' + r.replace(/\s+/g, '-'));
    })();
  </script>
  <style>
    /* hide every sidebar item whose data-role does not contain the current role ("all" is always shown) */
    html.role-admin .nav-item[data-role]:not([data-role="all"]):not([data-role*="admin"]),
    html.role-manager .nav-item[data-role]:not([data-role="all"]):not([data-role*="manager"]),
    html.role-customer-service .nav-item[data-role]:not([data-role="all"]):not([data-role*="customer service"]),
    html.role-sales-staff .nav-item[data-role]:not([data-role="all"]):not([data-role*="sales staff"]) {
      display: none !important;
    }
    /* the text parts (CRM subtitle, name, role) wait until navbar.js fills them in */
    html:not(.role-ready) .brand-subtitle,
    html:not(.role-ready) #dropdownUserName,
    html:not(.role-ready) #dropdownUserRole { visibility: hidden !important; }
  </style>
  <script>
    // Safety: if navbar.js ever fails, do not leave the text hidden forever
    setTimeout(function () { document.documentElement.classList.add('role-ready'); }, 1500);
  </script>

  <!-- Bootstrap 5 CSS & Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css-InAllPages/stylesheet-login.css">
  <link rel="stylesheet" href="css-InAllPages/navbar.css">
  <link rel="stylesheet" href="css-InAllPages/adminpages.css">
  <link rel="stylesheet" href="css-InAllPages/Notification.css">
</head>
<body>

  <div class="crm-layout">

    <!-- 1. Left Sidebar Navigation -->
    <aside class="crm-sidebar" id="crmSidebar">
      <div class="sidebar-header d-flex align-items-center justify-content-between px-3">
        <div class="brand-group">
          <h1 class="brand-title m-0 fw-bold">CRM</h1>
          <span class="brand-subtitle">Admin</span>
        </div>
        <button class="btn p-0 border-0 burger-toggle-btn" id="burgerToggle" aria-label="Toggle Sidebar Navigation">
          <i class="bi bi-list fs-2"></i>
        </button>
      </div>

      <!-- Navigation Links
           data-role = who can SEE the item (navbar.js hides it for everyone else).
           Roles: admin, manager, customer service, sales staff   ("all" = everyone)
           'dashboard' and 'reports' open a DIFFERENT file per role (set in navbar.js). -->
      <nav class="sidebar-nav px-2">
        <ul class="nav flex-column">
          <li class="nav-item" data-role="all">
            <a href="#" onclick="loadPage('dashboard', this); return false;" class="nav-link d-flex align-items-center">
              <img src="icons/dashboard-icon.svg" class="sidebar-icon" alt="Dashboard Icon">
              <span class="nav-text ms-3">Dashboard</span>
            </a>
          </li>
          <li class="nav-item" data-role="admin, manager, customer service, sales staff">
            <a href="#" onclick="loadPage('Contact.html', this); return false;" class="nav-link d-flex align-items-center">
              <img src="icons/contacts-icon.svg" class="sidebar-icon" alt="Contacts Icon">
              <span class="nav-text ms-3">Contacts</span>
            </a>
          </li>
          <li class="nav-item" data-role="admin, manager, sales staff">
            <a href="#" onclick="loadPage('leadsAndDeals.html', this); return false;" class="nav-link d-flex align-items-center">
              <img src="icons/leads-and-deals-icon.svg" class="sidebar-icon" alt="Leads & Deals Icon">
              <span class="nav-text ms-3">Leads & Deals</span>
            </a>
          </li>
          <li class="nav-item" data-role="admin, manager, customer service">
            <a href="#" onclick="loadPage('Ticket.html', this); return false;" class="nav-link d-flex align-items-center">
              <img src="icons/tickets-icon.svg" class="sidebar-icon" alt="Tickets Icon">
              <span class="nav-text ms-3">Tickets</span>
            </a>
          </li>
          <li class="nav-item" data-role="admin, manager, customer service, sales staff">
            <a href="#" onclick="loadPage('Activities.html', this); return false;" class="nav-link d-flex align-items-center">
              <img src="icons/activity-icon.svg" class="sidebar-icon" alt="Activities Icon">
              <span class="nav-text ms-3">Activities</span>
            </a>
          </li>
          <li class="nav-item" data-role="admin, manager, customer service, sales staff">
            <a href="#" onclick="loadPage('reports', this); return false;" class="nav-link d-flex align-items-center">
              <img src="icons/report-icon.svg" class="sidebar-icon" alt="Reports Icon">
              <span class="nav-text ms-3">Reports</span>
            </a>
          </li>
          <li class="nav-item" data-role="admin">
            <a href="#" onclick="loadPage('settings.html', this); return false;" class="nav-link d-flex align-items-center">
              <img src="icons/settings-icon.svg" class="sidebar-icon" alt="Settings Icon">
              <span class="nav-text ms-3">Settings</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- 2. Main Content Wrapper -->
    <div class="crm-main-content d-flex flex-column flex-grow-1">

      <!-- Top Header Bar -->
      <header class="top-navbar d-flex align-items-center justify-content-end px-4">
        <div class="top-navbar-actions d-flex align-items-center gap-3 gap-md-4">

          <!-- Theme Toggle -->
          <button type="button" class="theme-toggle-header border-0 bg-transparent p-0" id="themeToggle" aria-label="Toggle theme">
            <img src="icons/sun-icon.svg" class="sun-icon" alt="Sun Icon">
            <img src="icons/moon-icon.svg" class="moon-icon" alt="Moon Icon">
          </button>

          <!-- Notification Bell -->
          <button class="btn-icon position-relative border-0 bg-transparent p-0" id="notificationBell" aria-label="Notifications">
            <i class="bi bi-bell fs-5"></i>
            <span class="notification-badge" id="notificationDot"></span>
          </button>

          <!-- Profile Dropdown -->
          <div class="dropdown">
            <button class="user-avatar-btn border-0 d-flex align-items-center justify-content-center p-0" id="userMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              <img src="icons/contacts-icon.svg" class="avatar-icon" alt="User Profile Icon">
            </button>
            <div class="dropdown-menu user-profile-card dropdown-menu-end shadow border-0 p-0 overflow-hidden" aria-labelledby="userMenuDropdown">
              <div class="user-info-section p-3">
                <h6 class="user-name mb-1 fw-bold" id="dropdownUserName">Shane Admin</h6>
                <span class="user-role small" id="dropdownUserRole">Admin</span>
              </div>
              <a class="logout-action-btn d-flex align-items-center gap-3 text-decoration-none" id="logoutBtn" href="login.html">
                <img src="icons/leave-icon.svg" class="leave-icon" alt="Logout Icon">
                <span class="logout-text fw-semibold">Logout</span>
              </a>
            </div>
          </div>

        </div>
      </header>

      <!-- 3. Dynamic Page Canvas Container -->
      <main class="content-body p-3 p-md-4 flex-grow-1" id="mainContentArea">
        <!-- Dynamic templates load here -->
      </main>

    </div>

  </div>

  <!-- Page Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js-InAllPages/loading.js"></script>
  <script src="js-InAllPages/navbar.js?v=2"></script>
  <script src="js-InAllPages/pages.js?v=2"></script>
  <script src="js-InAllPages/notification.js"></script>

  <!-- Sidebar Collapse Logic
       (role-based show/hide of sidebar items moved into navbar.js) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const burgerToggle = document.getElementById("burgerToggle");
      const crmSidebar = document.getElementById("crmSidebar");

      // Restore collapsed state
      const isCollapsed = localStorage.getItem("sidebarCollapsed") === "true";
      if (isCollapsed && crmSidebar) {
        crmSidebar.classList.add("collapsed");
        document.documentElement.classList.add("sidebar-is-collapsed");
      }

      if (burgerToggle && crmSidebar) {
        burgerToggle.addEventListener("click", () => {
          crmSidebar.classList.toggle("collapsed");
          const currentlyCollapsed = crmSidebar.classList.contains("collapsed");
          localStorage.setItem("sidebarCollapsed", currentlyCollapsed);

          if (currentlyCollapsed) {
            document.documentElement.classList.add("sidebar-is-collapsed");
          } else {
            document.documentElement.classList.remove("sidebar-is-collapsed");
          }
        });
      }
    });
  </script>
</body>
</html>
